---
dependency:
  name: galaxy
  options:
    requirements-file: requirements.yml
    force: true
driver:
  name: docker
platforms:
  - name: authentik-${MOLECULE_DISTRO:-ubuntu2604}-default
    image: "geerlingguy/docker-${MOLECULE_DISTRO:-ubuntu2604}-ansible:latest"
    command: ${MOLECULE_DOCKER_COMMAND:-""}
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host
    privileged: true
    pre_build_image: true
provisioner:
  name: ansible
  config_options:
    defaults:
      callback_result_format: yaml
  inventory:
    group_vars:
      all:
        # Helper variables
        authentik_debug_service_worker_enabled: false
        authentik_debug_service_server_enabled: false

        # Variables for authentik
        authentik_uid: 1000
        authentik_gid: 1000
        authentik_hostname: localhost
        authentik_path_prefix: /authentik-test
        authentik_container_labels_traefik_enabled: false
        authentik_container_http_host_bind_port: 9000
        authentik_secret_key: secret

        # Diagnostic-only wrapper for measuring how long Docker retains the exact
        # container name after failed-start cleanup. The production default remains
        # unchanged, and the complete docker-create argv is still passed as "$@".
        authentik_server_container_create_command: |
          first_create_attempt_ns=$(date +%s%N);
          first_create_attempt=$(date --utc +%Y-%m-%dT%H:%M:%S.%NZ);
          deadline_ns=$((first_create_attempt_ns + 60000000000));
          first_name_conflict=;
          first_name_conflict_ns=;
          conflict_attempts=0;
          while :; do
          if create_output=$("$@" 2>&1); then
          first_create_success_ns=$(date +%s%N);
          first_create_success=$(date --utc +%Y-%m-%dT%H:%M:%S.%NZ);
          echo "$create_output";
          if [ -n "$first_name_conflict_ns" ]; then
          conflict_duration_ns=$((first_create_success_ns - first_name_conflict_ns));
          conflict_duration_seconds=$(printf '%s.%09d' "$((conflict_duration_ns / 1000000000))" "$((conflict_duration_ns % 1000000000))");
          echo "AUTHENTIK_NAME_RELEASE FIRST_CREATE_ATTEMPT=$first_create_attempt FIRST_CREATE_ATTEMPT_NS=$first_create_attempt_ns FIRST_NAME_CONFLICT=$first_name_conflict FIRST_NAME_CONFLICT_NS=$first_name_conflict_ns FIRST_CREATE_SUCCESS=$first_create_success FIRST_CREATE_SUCCESS_NS=$first_create_success_ns CONFLICT_DURATION_SECONDS=$conflict_duration_seconds CONFLICT_ATTEMPTS=$conflict_attempts" >&2;
          fi;
          exit 0;
          fi;
          case "$create_output" in
          *"Conflict. The container name"*"is already in use by container"*)
          conflict_attempts=$((conflict_attempts + 1));
          if [ -z "$first_name_conflict_ns" ]; then
          first_name_conflict_ns=$(date +%s%N);
          first_name_conflict=$(date --utc +%Y-%m-%dT%H:%M:%S.%NZ);
          fi;
          now_ns=$(date +%s%N);
          if [ "$now_ns" -ge "$deadline_ns" ]; then
          conflict_duration_ns=$((now_ns - first_name_conflict_ns));
          conflict_duration_seconds=$(printf '%s.%09d' "$((conflict_duration_ns / 1000000000))" "$((conflict_duration_ns % 1000000000))");
          echo "$create_output" >&2;
          echo "AUTHENTIK_NAME_RELEASE FIRST_CREATE_ATTEMPT=$first_create_attempt FIRST_CREATE_ATTEMPT_NS=$first_create_attempt_ns FIRST_NAME_CONFLICT=$first_name_conflict FIRST_NAME_CONFLICT_NS=$first_name_conflict_ns FIRST_CREATE_SUCCESS=NONE FIRST_CREATE_SUCCESS_NS=NONE CONFLICT_DURATION_SECONDS=$conflict_duration_seconds CONFLICT_ATTEMPTS=$conflict_attempts" >&2;
          echo "Failed to create container authentik-server within the 60-second diagnostic window because Docker did not release its name" >&2;
          exit 1;
          fi;
          sleep 1;
          ;;
          *)
          echo "$create_output" >&2;
          exit 1;
          ;;
          esac;
          done

        # Variables required for authentik to connect to the Postgres database.
        #
        # Postgres is the only data-store authentik needs nowadays: as of authentik
        # 2025.10 the cache and the task queue live in Postgres too, which is why
        # this role no longer has any Redis variables to wire up here.
        # See: https://docs.goauthentik.io/releases/2025.10
        authentik_database_hostname: "{{ postgres_connection_hostname }}"
        authentik_database_port: "{{ postgres_connection_port }}"
        authentik_database_username: my_database_username
        authentik_database_password: my_database_password
        authentik_database_name: authentik
        authentik_server_systemd_required_services_list_auto: |
          {{
            (['postgres.service'])
          }}
        authentik_worker_systemd_required_services_list_auto: |
          {{
            (['postgres.service'])
          }}

        # Variables for Postgres
        postgres_uid: 1000
        postgres_gid: 1000
        # Spelled out (it repeats the role default) so that the verify play, where
        # the Postgres role's defaults are not in scope, can address the container.
        postgres_identifier: postgres
        postgres_connection_password: postgres_password
        postgres_container_network: "{{ authentik_container_network }}"
        postgres_managed_databases: |
          {{
            [{
              'name': authentik_database_name,
              'username': authentik_database_username,
              'password': authentik_database_password,
            }]
          }}
  env:
    # Workaround for https://github.com/ansible/molecule/issues/4391
    ANSIBLE_ROLES_PATH: ${MOLECULE_PROJECT_DIRECTORY}/..:/.ansible/roles:/usr/share/ansible/roles:/etc/ansible/roles:~/.ansible/roles
scenario:
  # See: https://docs.ansible.com/projects/molecule/configuration/?h=test_sequence#scenario
  test_sequence:
    - dependency
    - cleanup
    - destroy
    - syntax
    - create
    - prepare
    - converge
    # Disable idempotence test for now due to ansible-role-postgres
    # - idempotence
    - side_effect
    - verify
    - cleanup
    - destroy
verifier:
  name: ansible
