---
- name: Exercise authentik systemd readiness behavior
  hosts: all
  become: true
  gather_facts: false

  vars:
    authentik_readiness_test_server_service: authentik-server.service
    authentik_readiness_test_worker_service: authentik-worker.service
    authentik_readiness_test_server_container: authentik-server
    authentik_readiness_test_postgres_container: postgres
    authentik_readiness_test_network: authentik
    authentik_readiness_test_dropin_directory: /run/systemd/system/authentik-server.service.d
    authentik_readiness_test_dropin_path: "{{ authentik_readiness_test_dropin_directory }}/readiness-test.conf"
    authentik_readiness_test_url: http://localhost:9000/-/health/ready/

  tasks:
    - name: Read the installed authentik server unit  # noqa command-instead-of-module
      ansible.builtin.command:
        cmd: systemctl cat authentik-server.service
      register: authentik_readiness_server_unit
      changed_when: false

    - name: Read the installed authentik worker unit  # noqa command-instead-of-module
      ansible.builtin.command:
        cmd: systemctl cat authentik-worker.service
      register: authentik_readiness_worker_unit
      changed_when: false

    - name: Assert the server unit encodes the application-readiness contract
      ansible.builtin.assert:
        that:
          - "'Type=simple' in authentik_readiness_server_unit.stdout"
          - "'ExecStartPost=' in authentik_readiness_server_unit.stdout"
          - "'/-/health/ready/' in authentik_readiness_server_unit.stdout"
          - "'/authentik-test/-/health/ready/' not in authentik_readiness_server_unit.stdout"
          - "'200 <= response.status < 300' in authentik_readiness_server_unit.stdout"
          - "'$MAINPID' in authentik_readiness_server_unit.stdout"
          - "'127.0.0.1' in authentik_readiness_server_unit.stdout"
          - "'9000' in authentik_readiness_server_unit.stdout"
          - "'TimeoutStartSec=900s' in authentik_readiness_server_unit.stdout"
          - "authentik_readiness_server_unit.stdout is search('ExecStop=.*docker stop -t [0-9]+ authentik-server')"
          - "'ExecStopPost=' in authentik_readiness_server_unit.stdout"
          - "'docker rm -f authentik-server' in authentik_readiness_server_unit.stdout"
          - "authentik_readiness_server_unit.stdout.find('ExecStop=') < authentik_readiness_server_unit.stdout.find('ExecStopPost=')"
          - "'Restart=always' in authentik_readiness_server_unit.stdout"
          - "'RestartSec=30' in authentik_readiness_server_unit.stdout"
        fail_msg: "The installed authentik server unit does not encode the expected readiness, cleanup, and restart behavior"

    - name: Assert the independent worker unit was not given the server readiness barrier
      ansible.builtin.assert:
        that:
          - "'ExecStartPost=' not in authentik_readiness_worker_unit.stdout"
          - "'TimeoutStartSec=' not in authentik_readiness_worker_unit.stdout"
          - "'Requires=authentik-server.service' in authentik_readiness_worker_unit.stdout"
          - "'After=authentik-server.service' in authentik_readiness_worker_unit.stdout"
          - "'Restart=always' in authentik_readiness_worker_unit.stdout"
          - "'RestartSec=30' in authentik_readiness_worker_unit.stdout"
        fail_msg: "The authentik worker unit no longer preserves its independent service contract"

    - name: Create the runtime systemd override directory for failure tests
      ansible.builtin.file:
        path: "{{ authentik_readiness_test_dropin_directory }}"
        state: directory
        mode: "0755"

    - name: Disable automatic restart while testing MAINPID failure
      ansible.builtin.copy:
        dest: "{{ authentik_readiness_test_dropin_path }}"
        mode: "0644"
        content: |
          [Service]
          Restart=no

    - name: Reload systemd for the MAINPID failure override
      ansible.builtin.systemd_service:
        daemon_reload: true

    - name: Verify MAINPID death fails startup and removes the container
      block:
        - name: Stop the authentik worker before the MAINPID failure test
          ansible.builtin.systemd_service:
            name: "{{ authentik_readiness_test_worker_service }}"
            state: stopped

        - name: Stop the authentik server before the MAINPID failure test
          ansible.builtin.systemd_service:
            name: "{{ authentik_readiness_test_server_service }}"
            state: stopped

        - name: Disconnect Postgres to hold authentik below application readiness  # noqa command-instead-of-module
          ansible.builtin.command:
            cmd: >-
              docker network disconnect
              {{ authentik_readiness_test_network }}
              {{ authentik_readiness_test_postgres_container }}
          changed_when: true

        - name: Start the authentik server without waiting for readiness
          ansible.builtin.systemd_service:
            name: "{{ authentik_readiness_test_server_service }}"
            state: started
            no_block: true

        - name: Wait for the server unit to enter its post-start readiness phase
          ansible.builtin.systemd_service:
            name: "{{ authentik_readiness_test_server_service }}"
          register: authentik_readiness_activating_service
          until:
            - authentik_readiness_activating_service.status.ActiveState == 'activating'
            - authentik_readiness_activating_service.status.SubState == 'start-post'
            - authentik_readiness_activating_service.status.MainPID | int > 0
          retries: 30
          delay: 1

        - name: Terminate the server MAINPID during readiness polling
          ansible.builtin.command:
            cmd: "kill -TERM {{ authentik_readiness_activating_service.status.MainPID }}"
          changed_when: true

        - name: Wait for MAINPID death to fail the server startup
          ansible.builtin.systemd_service:
            name: "{{ authentik_readiness_test_server_service }}"
          register: authentik_readiness_mainpid_failure
          until: authentik_readiness_mainpid_failure.status.ActiveState == 'failed'
          retries: 15
          delay: 1

        - name: Wait for failed-start cleanup to remove the server container  # noqa command-instead-of-module
          ansible.builtin.command:
            cmd: "docker container inspect {{ authentik_readiness_test_server_container }}"
          register: authentik_readiness_mainpid_container
          changed_when: false
          failed_when: false
          until: authentik_readiness_mainpid_container.rc != 0
          retries: 15
          delay: 1

        - name: Assert MAINPID death failed promptly and cleaned up
          ansible.builtin.assert:
            that:
              - authentik_readiness_mainpid_failure.status.ActiveState == 'failed'
              - authentik_readiness_mainpid_container.rc != 0
            fail_msg: "MAINPID death did not fail startup promptly and remove the authentik server container"
      always:
        - name: Stop the server after the MAINPID failure test
          ansible.builtin.systemd_service:
            name: "{{ authentik_readiness_test_server_service }}"
            state: stopped
          failed_when: false

        - name: Reconnect Postgres after the MAINPID failure test  # noqa command-instead-of-module
          ansible.builtin.command:
            cmd: >-
              docker network connect
              {{ authentik_readiness_test_network }}
              {{ authentik_readiness_test_postgres_container }}
          register: authentik_readiness_mainpid_reconnect
          changed_when: authentik_readiness_mainpid_reconnect.rc == 0
          failed_when:
            - authentik_readiness_mainpid_reconnect.rc != 0
            - "'already exists' not in authentik_readiness_mainpid_reconnect.stderr"

        - name: Reset the server failure after the MAINPID test  # noqa command-instead-of-module
          ansible.builtin.command:
            cmd: systemctl reset-failed authentik-server.service
          changed_when: false

    - name: Set a short startup ceiling for the timeout failure test
      ansible.builtin.copy:
        dest: "{{ authentik_readiness_test_dropin_path }}"
        mode: "0644"
        content: |
          [Service]
          Restart=no
          TimeoutStartSec=5s

    - name: Reload systemd for the timeout failure override
      ansible.builtin.systemd_service:
        daemon_reload: true

    - name: Verify the startup ceiling fails readiness and removes the container
      block:
        - name: Disconnect Postgres to hold authentik below readiness until timeout  # noqa command-instead-of-module
          ansible.builtin.command:
            cmd: >-
              docker network disconnect
              {{ authentik_readiness_test_network }}
              {{ authentik_readiness_test_postgres_container }}
          changed_when: true

        - name: Start the authentik server and allow the bounded readiness wait to fail
          ansible.builtin.systemd_service:
            name: "{{ authentik_readiness_test_server_service }}"
            state: started
          register: authentik_readiness_timeout_start
          failed_when: false

        - name: Wait for the startup timeout to fail the server unit
          ansible.builtin.systemd_service:
            name: "{{ authentik_readiness_test_server_service }}"
          register: authentik_readiness_timeout_failure
          until: authentik_readiness_timeout_failure.status.ActiveState == 'failed'
          retries: 15
          delay: 1

        - name: Wait for timeout cleanup to remove the server container  # noqa command-instead-of-module
          ansible.builtin.command:
            cmd: "docker container inspect {{ authentik_readiness_test_server_container }}"
          register: authentik_readiness_timeout_container
          changed_when: false
          failed_when: false
          until: authentik_readiness_timeout_container.rc != 0
          retries: 15
          delay: 1

        - name: Assert the startup timeout failed and cleaned up
          ansible.builtin.assert:
            that:
              - authentik_readiness_timeout_failure.status.ActiveState == 'failed'
              - authentik_readiness_timeout_container.rc != 0
            fail_msg: "The startup timeout did not fail the unit and remove the authentik server container"
      always:
        - name: Stop the server after the timeout failure test
          ansible.builtin.systemd_service:
            name: "{{ authentik_readiness_test_server_service }}"
            state: stopped
          failed_when: false

        - name: Reconnect Postgres after the timeout failure test  # noqa command-instead-of-module
          ansible.builtin.command:
            cmd: >-
              docker network connect
              {{ authentik_readiness_test_network }}
              {{ authentik_readiness_test_postgres_container }}
          register: authentik_readiness_timeout_reconnect
          changed_when: authentik_readiness_timeout_reconnect.rc == 0
          failed_when:
            - authentik_readiness_timeout_reconnect.rc != 0
            - "'already exists' not in authentik_readiness_timeout_reconnect.stderr"

        - name: Remove the runtime startup-failure override
          ansible.builtin.file:
            path: "{{ authentik_readiness_test_dropin_path }}"
            state: absent

        - name: Reload systemd after removing the failure-test override
          ansible.builtin.systemd_service:
            daemon_reload: true

        - name: Reset the server failure after the timeout test  # noqa command-instead-of-module
          ansible.builtin.command:
            cmd: systemctl reset-failed authentik-server.service
          changed_when: false

    - name: Restore the authentik server through the normal readiness barrier
      block:
        - name: Start the authentik server through the normal readiness barrier
          ansible.builtin.systemd_service:
            name: "{{ authentik_readiness_test_server_service }}"
            state: started
          register: authentik_readiness_immediate_restore
      rescue:
        - name: Capture concise status after the immediate restoration failure  # noqa command-instead-of-module
          ansible.builtin.command:
            argv:
              - systemctl
              - status
              - "{{ authentik_readiness_test_server_service }}"
              - --no-pager
              - --full
          register: authentik_readiness_restore_status
          changed_when: false
          failed_when: false

        - name: Capture lifecycle properties after the immediate restoration failure  # noqa command-instead-of-module
          ansible.builtin.command:
            argv:
              - systemctl
              - show
              - "{{ authentik_readiness_test_server_service }}"
              - --property=ActiveState
              - --property=SubState
              - --property=Result
              - --property=MainPID
              - --property=ExecMainCode
              - --property=ExecMainStatus
              - --property=ExecStartPre
              - --property=ExecStart
              - --property=ExecStartPost
              - --property=TimeoutStartUSec
              - --property=Restart
              - --property=RestartUSec
              - --property=DropInPaths
              - --property=InvocationID
              - --property=NRestarts
          register: authentik_readiness_restore_properties
          changed_when: false
          failed_when: false

        - name: Read the failed restoration invocation identifier  # noqa command-instead-of-module
          ansible.builtin.command:
            argv:
              - systemctl
              - show
              - "{{ authentik_readiness_test_server_service }}"
              - --property=InvocationID
              - --value
          register: authentik_readiness_restore_invocation
          changed_when: false
          failed_when: false

        - name: Capture the failed restoration invocation journal  # noqa command-instead-of-module
          ansible.builtin.command:
            argv:
              - journalctl
              - --unit={{ authentik_readiness_test_server_service }}
              - _SYSTEMD_INVOCATION_ID={{ authentik_readiness_restore_invocation.stdout | trim }}
              - --no-pager
              - --output=short-iso-precise
          register: authentik_readiness_restore_journal
          changed_when: false
          failed_when: false
          when: authentik_readiness_restore_invocation.stdout | trim | length > 0

        - name: Capture the short recent unit journal when the invocation is unavailable  # noqa command-instead-of-module
          ansible.builtin.command:
            argv:
              - journalctl
              - --unit={{ authentik_readiness_test_server_service }}
              - --since=-2min
              - --no-pager
              - --output=short-iso-precise
              - --lines=160
          register: authentik_readiness_restore_recent_journal
          changed_when: false
          failed_when: false
          when: authentik_readiness_restore_invocation.stdout | trim | length == 0

        - name: Capture the exact server container state after restoration failure  # noqa command-instead-of-module
          ansible.builtin.command:
            cmd: >-
              docker container inspect
              --format '{% raw %}{{json .State}}{% endraw %}'
              {{ authentik_readiness_test_server_container }}
          register: authentik_readiness_restore_container
          changed_when: false
          failed_when: false

        - name: Report first-tier restoration failure evidence
          ansible.builtin.debug:
            msg:
              immediate_start: "{{ authentik_readiness_immediate_restore }}"
              systemd_status: "{{ authentik_readiness_restore_status.stdout_lines }}"
              systemd_properties: "{{ authentik_readiness_restore_properties.stdout_lines }}"
              unit_journal: >-
                {{
                  authentik_readiness_restore_journal.stdout_lines
                  if authentik_readiness_restore_journal is not skipped
                  else authentik_readiness_restore_recent_journal.stdout_lines
                }}
              container_state: >-
                {{
                  authentik_readiness_restore_container.stdout
                  if authentik_readiness_restore_container.rc == 0
                  else 'absent'
                }}

        - name: Classify directly implicated restoration conditions
          ansible.builtin.set_fact:
            authentik_readiness_restore_name_failure: >-
              {{ authentik_readiness_restore_journal_text is search('(?i)(container name.*already in use|conflict.*container name)') }}
            authentik_readiness_restore_port_failure: >-
              {{ authentik_readiness_restore_journal_text is search('(?i)(port is already allocated|address already in use|bind for .* failed)') }}
            authentik_readiness_restore_start_limit: >-
              {{ authentik_readiness_restore_journal_text is search('(?i)(start request repeated too quickly|start-limit-hit)') }}
            authentik_readiness_restore_postgres_failure: >-
              {{ authentik_readiness_restore_journal_text is search('(?i)(wait_for_db|postgres|database connection)') }}
            authentik_readiness_restore_container_present: >-
              {{ authentik_readiness_restore_container.rc == 0 }}
            authentik_readiness_restore_container_exited: >-
              {{
                authentik_readiness_restore_container.rc == 0
                and authentik_readiness_restore_container.stdout is search('"Status":"exited"')
              }}
          vars:
            authentik_readiness_restore_journal_text: >-
              {{
                authentik_readiness_restore_journal.stdout
                if authentik_readiness_restore_journal is not skipped
                else authentik_readiness_restore_recent_journal.stdout
              }}

        - name: Capture exact-name Docker events when name or container state is implicated  # noqa command-instead-of-module
          ansible.builtin.command:
            argv:
              - docker
              - events
              - --since=2m
              - --until=0s
              - --filter=type=container
              - --filter=container={{ authentik_readiness_test_server_container }}
              - --format={% raw %}{{json .}}{% endraw %}
          register: authentik_readiness_restore_docker_events
          changed_when: false
          failed_when: false
          when:
            - >-
              authentik_readiness_restore_name_failure
              or authentik_readiness_restore_container_present

        - name: Capture configured-port ownership when a bind failure is implicated  # noqa command-instead-of-module
          ansible.builtin.command:
            argv:
              - ss
              - -H
              - -ltnp
              - sport = :9000
          register: authentik_readiness_restore_port_state
          changed_when: false
          failed_when: false
          when: authentik_readiness_restore_port_failure

        - name: Capture exact container logs after an immediate container exit  # noqa command-instead-of-module
          ansible.builtin.command:
            argv:
              - docker
              - logs
              - "{{ authentik_readiness_test_server_container }}"
          register: authentik_readiness_restore_container_logs
          changed_when: false
          failed_when: false
          when: authentik_readiness_restore_container_exited

        - name: Capture start-limit properties when systemd rate limiting is implicated  # noqa command-instead-of-module
          ansible.builtin.command:
            argv:
              - systemctl
              - show
              - "{{ authentik_readiness_test_server_service }}"
              - --property=StartLimitBurst
              - --property=StartLimitIntervalUSec
              - --property=NRestarts
          register: authentik_readiness_restore_start_limit_state
          changed_when: false
          failed_when: false
          when: authentik_readiness_restore_start_limit

        - name: Verify Postgres network membership when database recovery is implicated  # noqa command-instead-of-module
          ansible.builtin.command:
            cmd: >-
              docker network inspect
              --format '{% raw %}{{range .Containers}}{{println .Name}}{{end}}{% endraw %}'
              {{ authentik_readiness_test_network }}
          register: authentik_readiness_restore_network_members
          changed_when: false
          failed_when: false
          when: authentik_readiness_restore_postgres_failure

        - name: Report condition-specific restoration evidence
          ansible.builtin.debug:
            msg:
              docker_events: "{{ authentik_readiness_restore_docker_events.stdout_lines | default('not-applicable') }}"
              port_state: "{{ authentik_readiness_restore_port_state.stdout_lines | default('not-applicable') }}"
              container_logs: "{{ authentik_readiness_restore_container_logs.stdout_lines | default('not-applicable') }}"
              start_limit: "{{ authentik_readiness_restore_start_limit_state.stdout_lines | default('not-applicable') }}"
              network_members: "{{ authentik_readiness_restore_network_members.stdout_lines | default('not-applicable') }}"

        - name: Observe release of the implicated container name  # noqa command-instead-of-module
          ansible.builtin.command:
            cmd: "docker container inspect {{ authentik_readiness_test_server_container }}"
          register: authentik_readiness_restore_name_state
          changed_when: false
          failed_when: false
          until: authentik_readiness_restore_name_state.rc != 0
          retries: 30
          delay: 1
          when: authentik_readiness_restore_name_failure

        - name: Observe release of the implicated host port  # noqa command-instead-of-module
          ansible.builtin.command:
            argv:
              - ss
              - -H
              - -ltnp
              - sport = :9000
          register: authentik_readiness_restore_port_release
          changed_when: false
          failed_when: false
          until: authentik_readiness_restore_port_release.stdout | trim | length == 0
          retries: 30
          delay: 1
          when: authentik_readiness_restore_port_failure

        - name: Wait before the control retry when no concrete transient was identified
          ansible.builtin.pause:
            seconds: 30
          when:
            - not authentik_readiness_restore_name_failure
            - not authentik_readiness_restore_port_failure

        - name: Stop the server before the explicit control retry
          ansible.builtin.systemd_service:
            name: "{{ authentik_readiness_test_server_service }}"
            state: stopped
          failed_when: false

        - name: Reset the server failure before the explicit control retry  # noqa command-instead-of-module
          ansible.builtin.command:
            cmd: systemctl reset-failed authentik-server.service
          changed_when: false

        - name: Retry the same explicit normal server start
          ansible.builtin.systemd_service:
            name: "{{ authentik_readiness_test_server_service }}"
            state: started
          register: authentik_readiness_control_restore
          failed_when: false

        - name: Report the explicit control retry result
          ansible.builtin.debug:
            var: authentik_readiness_control_restore

        - name: Require the explicit control retry to restore the server
          ansible.builtin.assert:
            that: not (authentik_readiness_control_restore.failed | default(false))
            fail_msg: "The explicit control retry did not restore the authentik server"

    - name: Verify blocking startup returned only after application readiness
      ansible.builtin.uri:
        url: "{{ authentik_readiness_test_url }}"
        method: GET
        status_code: [200]

    - name: Start the authentik worker after server readiness
      ansible.builtin.systemd_service:
        name: "{{ authentik_readiness_test_worker_service }}"
        state: started

    - name: Exercise the preserved normal graceful stop path
      block:
        - name: Stop the authentik worker before the normal server stop
          ansible.builtin.systemd_service:
            name: "{{ authentik_readiness_test_worker_service }}"
            state: stopped

        - name: Stop the authentik server normally
          ansible.builtin.systemd_service:
            name: "{{ authentik_readiness_test_server_service }}"
            state: stopped

        - name: Check that normal stop removed the server container  # noqa command-instead-of-module
          ansible.builtin.command:
            cmd: "docker container inspect {{ authentik_readiness_test_server_container }}"
          register: authentik_readiness_normal_stop_container
          changed_when: false
          failed_when: false

        - name: Assert normal stop removed the server container
          ansible.builtin.assert:
            that: authentik_readiness_normal_stop_container.rc != 0
            fail_msg: "Normal stop left the authentik server container behind"
      always:
        - name: Start the authentik server after the normal-stop test
          ansible.builtin.systemd_service:
            name: "{{ authentik_readiness_test_server_service }}"
            state: started

        - name: Start the authentik worker after the normal-stop test
          ansible.builtin.systemd_service:
            name: "{{ authentik_readiness_test_worker_service }}"
            state: started
