---
- name: Include roles for authentik Molecule tests
  hosts: all
  become: true
  gather_facts: true
  tasks:
    - name: Include roles for authentik Molecule tests
      ansible.builtin.include_role:
        name: "{{ role_name }}"
        public: true
      loop:
        - com.devture.ansible.role.playbook_help
        - com.devture.ansible.role.systemd_docker_base
        - ansible-role-postgres
        - "{{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') | basename }}"
      loop_control:
        loop_var: role_name

- name: Ensure services are started
  hosts: all
  become: true
  gather_facts: false
  tasks:
    - name: Ensure systemd daemon is reloaded
      ansible.builtin.systemd_service:
        daemon_reload: true

    - name: Ensure Postgres systemd service is started
      ansible.builtin.systemd_service:
        name: postgres.service
        state: started

    - name: Diagnose the initial authentik server startup without starting the worker
      block:
        - name: Start the authentik server without waiting for readiness
          ansible.builtin.systemd_service:
            name: authentik-server.service
            state: started
            no_block: true

        - name: Wait before capturing the server-only startup snapshot
          ansible.builtin.pause:
            seconds: 90

        - name: Read selected systemd startup state  # noqa command-instead-of-module
          ansible.builtin.command:
            argv:
              - systemctl
              - show
              - authentik-server.service
              - --property=ActiveState
              - --property=SubState
              - --property=Result
              - --property=MainPID
              - --property=ControlPID
              - --property=ExecMainCode
              - --property=ExecMainStatus
              - --property=ExecStartPost
              - --property=StateChangeTimestamp
          register: authentik_diagnostic_systemd
          changed_when: false
          failed_when: false

        - name: Read selected Docker state  # noqa command-instead-of-module
          ansible.builtin.command:
            argv:
              - docker
              - container
              - inspect
              - --format
              - "{% raw %}{{json .State}}{% endraw %}"
              - authentik-server
          register: authentik_diagnostic_docker_state
          changed_when: false
          failed_when: false

        - name: Read the server container process tree  # noqa command-instead-of-module
          ansible.builtin.command:
            argv:
              - systemctl
              - status
              - authentik-server.service
              - --no-pager
              - --lines=5
          register: authentik_diagnostic_processes
          changed_when: false
          failed_when: false

        - name: Probe sockets and health contracts  # noqa command-instead-of-module
          ansible.builtin.command:
            argv:
              - docker
              - exec
              - authentik-server
              - python
              - -c
              - |
                import http.client
                import json
                import os

                result = {
                    "socket:/tmp/authentik-core.sock": os.path.exists("/tmp/authentik-core.sock"),
                }
                for path in ("/-/health/live/", "/-/health/ready/"):
                    try:
                        connection = http.client.HTTPConnection("127.0.0.1", 9000, timeout=3)
                        connection.request("GET", path)
                        response = connection.getresponse()
                        result[path] = {"status": response.status, "body": response.read(512).decode(errors="replace")}
                        connection.close()
                    except Exception as error:
                        result[path] = {"error": f"{type(error).__name__}: {error}"}
                print(json.dumps(result, sort_keys=True))
          register: authentik_diagnostic_health
          changed_when: false
          failed_when: false

        - name: Run Authentik's packaged healthcheck  # noqa command-instead-of-module
          ansible.builtin.command:
            argv:
              - docker
              - exec
              - authentik-server
              - ak
              - healthcheck
          register: authentik_diagnostic_ak_healthcheck
          changed_when: false
          failed_when: false

        - name: Read Authentik advisory locks  # noqa command-instead-of-module
          ansible.builtin.command:
            argv:
              - docker
              - exec
              - postgres
              - psql
              - --username=my_database_username
              - --dbname=authentik
              - --no-psqlrc
              - --tuples-only
              - --no-align
              - --command=SELECT locktype, mode, granted, classid, objid, objsubid, pid FROM pg_locks WHERE locktype = 'advisory' ORDER BY pid;
          register: authentik_diagnostic_postgres_locks
          changed_when: false
          failed_when: false

        - name: Read Authentik database activity  # noqa command-instead-of-module
          ansible.builtin.command:
            argv:
              - docker
              - exec
              - postgres
              - psql
              - --username=my_database_username
              - --dbname=authentik
              - --no-psqlrc
              - --tuples-only
              - --no-align
              - --command=SELECT pid, usename, application_name, state, wait_event_type, wait_event, backend_type, age(clock_timestamp(), query_start) FROM pg_stat_activity WHERE datname = 'authentik' ORDER BY pid;
          register: authentik_diagnostic_postgres_activity
          changed_when: false
          failed_when: false

        - name: Read the bounded Authentik server journal  # noqa command-instead-of-module
          ansible.builtin.command:
            argv:
              - journalctl
              - --unit=authentik-server.service
              - --no-pager
              - --lines=250
              - --output=short-iso
          register: authentik_diagnostic_journal
          changed_when: false
          failed_when: false

        - name: Report the server-only startup snapshot
          ansible.builtin.debug:
            msg:
              systemd:
                rc: "{{ authentik_diagnostic_systemd.rc }}"
                stdout: "{{ authentik_diagnostic_systemd.stdout_lines }}"
                stderr: "{{ authentik_diagnostic_systemd.stderr_lines }}"
              docker_state:
                rc: "{{ authentik_diagnostic_docker_state.rc }}"
                stdout: "{{ authentik_diagnostic_docker_state.stdout_lines }}"
                stderr: "{{ authentik_diagnostic_docker_state.stderr_lines }}"
              process_tree:
                rc: "{{ authentik_diagnostic_processes.rc }}"
                stdout: "{{ authentik_diagnostic_processes.stdout_lines }}"
                stderr: "{{ authentik_diagnostic_processes.stderr_lines }}"
              socket_and_health:
                rc: "{{ authentik_diagnostic_health.rc }}"
                stdout: "{{ authentik_diagnostic_health.stdout_lines }}"
                stderr: "{{ authentik_diagnostic_health.stderr_lines }}"
              ak_healthcheck:
                rc: "{{ authentik_diagnostic_ak_healthcheck.rc }}"
                stdout: "{{ authentik_diagnostic_ak_healthcheck.stdout_lines }}"
                stderr: "{{ authentik_diagnostic_ak_healthcheck.stderr_lines }}"
              postgres_advisory_locks:
                rc: "{{ authentik_diagnostic_postgres_locks.rc }}"
                stdout: "{{ authentik_diagnostic_postgres_locks.stdout_lines }}"
                stderr: "{{ authentik_diagnostic_postgres_locks.stderr_lines }}"
              postgres_activity:
                rc: "{{ authentik_diagnostic_postgres_activity.rc }}"
                stdout: "{{ authentik_diagnostic_postgres_activity.stdout_lines }}"
                stderr: "{{ authentik_diagnostic_postgres_activity.stderr_lines }}"
              journal:
                rc: "{{ authentik_diagnostic_journal.rc }}"
                stdout: "{{ authentik_diagnostic_journal.stdout_lines }}"
                stderr: "{{ authentik_diagnostic_journal.stderr_lines }}"

        - name: Allow the readiness loop to observe the successful probe
          ansible.builtin.pause:
            seconds: 15

        - name: Read systemd state after the readiness transition window  # noqa command-instead-of-module
          ansible.builtin.command:
            argv:
              - systemctl
              - show
              - authentik-server.service
              - --property=ActiveState
              - --property=SubState
              - --property=Result
              - --property=MainPID
              - --property=ControlPID
              - --property=ExecStartPost
          register: authentik_diagnostic_transition_systemd
          changed_when: false
          failed_when: false

        - name: Probe readiness after the transition window  # noqa command-instead-of-module
          ansible.builtin.command:
            argv:
              - docker
              - exec
              - authentik-server
              - python
              - -c
              - >-
                import http.client, sys;
                connection = http.client.HTTPConnection("127.0.0.1", 9000, timeout=3);
                connection.request("GET", "/-/health/ready/");
                response = connection.getresponse();
                print(response.status);
                sys.exit(0 if 200 <= response.status < 300 else 1)
          register: authentik_diagnostic_transition_readiness
          changed_when: false
          failed_when: false

        - name: Report the post-readiness systemd transition
          ansible.builtin.debug:
            msg:
              systemd:
                rc: "{{ authentik_diagnostic_transition_systemd.rc }}"
                stdout: "{{ authentik_diagnostic_transition_systemd.stdout_lines }}"
                stderr: "{{ authentik_diagnostic_transition_systemd.stderr_lines }}"
              readiness:
                rc: "{{ authentik_diagnostic_transition_readiness.rc }}"
                stdout: "{{ authentik_diagnostic_transition_readiness.stdout_lines }}"
                stderr: "{{ authentik_diagnostic_transition_readiness.stderr_lines }}"

        - name: End the diagnostic run after preserving startup evidence
          ansible.builtin.fail:
            msg: >-
              Intentional diagnostic stop after collecting the server-only startup timeline;
              the authentik worker was not started.
      always:
        - name: Stop the authentik server after the diagnostic run
          ansible.builtin.systemd_service:
            name: authentik-server.service
            state: stopped
          failed_when: false
